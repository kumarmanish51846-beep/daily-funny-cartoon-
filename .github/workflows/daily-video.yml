name: Daily Funny Cartoon Short

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install pillow edge-tts

      - name: Generate video
        run: python make_video.py

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: daily-funny-cartoon
          path: output/
          retention-days: 30
